<mat-card appearance="outlined">
  <mat-card-content>
    @if (product$ | async; as product) {
      <sn-product-info [product]="product"></sn-product-info>
      <sn-product-basket-options
        [product]="product"
        [productQuantity]="(productQuantity$ | async) ?? 0"
      (addClick)="addToBasket()"></sn-product-basket-options>
    }
  </mat-card-content>
</mat-card>
