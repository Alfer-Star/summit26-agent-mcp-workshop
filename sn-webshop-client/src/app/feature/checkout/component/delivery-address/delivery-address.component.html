<ng-container *transloco="let translate; prefix: 'checkout'">
  <h2>{{ translate('deliveryAddress') }}</h2>

  <div class="user">
    <p snTestId="user-name">{{ user().name }}</p>
    <p snTestId="user-address">
      {{ user().addresses[0].streetNr }}, {{ user().addresses[0].city }}
    </p>
  </div>
</ng-container>
