<mat-card [routerLink]="[productGroupUrl]" *transloco="let translate; prefix: 'core'">
  <mat-card-title>{{ productGroup.name }} </mat-card-title>
  <mat-card-content>
    <img [src]="productGroup.imageUrl" alt="Produkt-Foto" />
  </mat-card-content>
  <mat-card-actions
    ><span>{{ translate('discover') }}</span>
  </mat-card-actions>
</mat-card>
