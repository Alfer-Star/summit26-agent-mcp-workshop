<div>Preis: {{ product().price }}$</div>
<div>Lieferdauer (Tage): {{ product().deliveryDuration }}</div>
<div>
  Noch auf Lager:
  {{ product().availableQuantity - productQuantity() }}
</div>
<button
  mat-raised-button
  color="primary"
  [disabled]="productQuantity() >= product().availableQuantity"
  (click)="addClick.emit()"
>
  Zum Warenkorb hinzufügen
</button>
